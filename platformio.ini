[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

Extra_scripts = pre:generate-compilation-db.py

lib_deps = https://github.com/johnrickman/LiquidCrystal_I2C.git
monitor_speed = 9600
